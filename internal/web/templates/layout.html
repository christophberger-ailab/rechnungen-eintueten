<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} – Rechnungen eintüten</title>
<script src="/static/htmx.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --line: #dfe3e8; --text: #1f2933; --muted: #6b7684;
  --ok: #1a7f5a; --info: #2a6dbd; --warn: #b2701a; --bad: #b3261e; --neutral: #6b7684;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
       background: var(--bg); color: var(--text); }
header { background: #1f2933; color: #fff; padding: .8rem 1.2rem; display: flex; gap: 1.4rem;
         align-items: baseline; }
header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
header nav a { color: #c8d0d8; text-decoration: none; margin-right: 1rem; }
header nav a.active, header nav a:hover { color: #fff; }
main { max-width: 1080px; margin: 1.4rem auto; padding: 0 1rem; }
h2 { font-size: 1.05rem; margin: 1.6rem 0 .6rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        padding: 1rem 1.1rem; margin-bottom: 1rem; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line);
         vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
a { color: var(--info); }
.tag { display: inline-block; padding: .05rem .5rem; border-radius: 10px; font-size: .78rem;
       border: 1px solid currentColor; }
.ok { color: var(--ok); } .info { color: var(--info); } .warn { color: var(--warn); }
.bad { color: var(--bad); } .neutral { color: var(--neutral); }
.counts { display: flex; gap: .8rem; flex-wrap: wrap; margin-bottom: .8rem; }
.count { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
         padding: .5rem .9rem; min-width: 7rem; }
.count b { display: block; font-size: 1.5rem; font-weight: 600; }
button { font: inherit; padding: .45rem 1rem; border-radius: 6px; border: 1px solid #1f2933;
         background: #1f2933; color: #fff; cursor: pointer; }
button[disabled] { opacity: .5; cursor: default; }
button.ghost { background: transparent; color: var(--bad); border-color: var(--line); }
input, select { font: inherit; padding: .35rem .5rem; border: 1px solid var(--line);
                border-radius: 5px; background: #fff; width: 100%; }
input[type=checkbox] { width: auto; }
.grid { display: grid; grid-template-columns: minmax(12rem, 18rem) 1fr; gap: .5rem 1rem;
        align-items: center; }
.note { color: var(--muted); font-size: .85rem; }
.flash { border-left: 3px solid var(--ok); padding-left: .7rem; }
.flash.bad { border-color: var(--bad); }
.events { font-size: .85rem; }
.events td { border: 0; padding: .15rem .5rem; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Rechnungen eintüten</h1>
  <nav>
    <a href="/" class="{{if eq .Active "dashboard"}}active{{end}}">Übersicht</a>
    <a href="/settings" class="{{if eq .Active "settings"}}active{{end}}">Einstellungen</a>
  </nav>
</header>
<main>
{{if .Message}}<p class="flash">{{.Message}}</p>{{end}}
{{if .Error}}<p class="flash bad">{{.Error}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>
